name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - '**'

jobs:
  build-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore Lorrgs.Api/Lorrgs.Api.csproj

      - name: Build API
        run: dotnet build Lorrgs.Api/Lorrgs.Api.csproj --configuration Release --no-restore

  test-api:
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Warcraft Logs library with coverage
        run: >-
          dotnet test Lorrgs.WarcraftLogs.Tests/Lorrgs.WarcraftLogs.Tests.csproj
          --configuration Release --verbosity normal
          -p:CollectCoverage=true
          -p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/warcraftlogs"

      - name: Test API and require 80% line and branch coverage per assembly
        run: >-
          dotnet test Lorrgs.Api.Tests/Lorrgs.Api.Tests.csproj
          --configuration Release --verbosity normal
          -p:CollectCoverage=true
          -p:MergeWith="$GITHUB_WORKSPACE/TestResults/warcraftlogs.json"
          -p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/coverage"
          -p:Threshold=80

      - name: Upload .NET coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: TestResults/*.cobertura.xml
          if-no-files-found: warn

  build-web:
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lorrgs-web/package-lock.json

      - name: Install web dependencies
        working-directory: lorrgs-web
        run: npm ci

      - name: Build web
        working-directory: lorrgs-web
        run: npm run build

  test-web:
    runs-on: ubuntu-latest
    needs: lint-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lorrgs-web/package-lock.json

      - name: Install web dependencies
        working-directory: lorrgs-web
        run: npm ci

      - name: Test web
        working-directory: lorrgs-web
        run: npm run test

  lint-web:
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lorrgs-web/package-lock.json

      - name: Install web dependencies
        working-directory: lorrgs-web
        run: npm ci

      - name: Lint web
        working-directory: lorrgs-web
        run: npm run lint