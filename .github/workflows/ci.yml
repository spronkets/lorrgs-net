name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore Lorrgs.Api/Lorrgs.Api.csproj

      - name: Build API
        run: dotnet build Lorrgs.Api/Lorrgs.Api.csproj --configuration Release --no-restore

  test-api:
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run .NET tests (if present)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_projects < <(grep -RIl '<PackageReference Include="Microsoft.NET.Test.Sdk"' --include='*.csproj' . || true)

          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No .NET test projects found. Skipping .NET test step."
            exit 0
          fi

          printf 'Found .NET test projects:\n%s\n' "${test_projects[*]}"
          for project in "${test_projects[@]}"; do
            echo "Running tests for ${project}"
            dotnet test "${project}" --configuration Release --verbosity normal
          done

  build-web:
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lorrgs-web/package-lock.json

      - name: Install web dependencies
        working-directory: lorrgs-web
        run: npm ci

      - name: Build web
        working-directory: lorrgs-web
        run: npm run build

  test-web:
    runs-on: ubuntu-latest
    needs: lint-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lorrgs-web/package-lock.json

      - name: Install web dependencies
        working-directory: lorrgs-web
        run: npm ci

      - name: Test web
        working-directory: lorrgs-web
        run: npm run test

  lint-web:
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lorrgs-web/package-lock.json

      - name: Install web dependencies
        working-directory: lorrgs-web
        run: npm ci

      - name: Lint web
        working-directory: lorrgs-web
        run: npm run lint