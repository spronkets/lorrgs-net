query RotationEvents(
  $code: String!
  $startTime: Float!
  $endTime: Float!
  $sourceId: Int!
  $fightIds: [Int!]
  $limit: Int!
) {
  reportData {
    report(code: $code) {
      events(
        dataType: Casts
        sourceID: $sourceId
        fightIDs: $fightIds
        startTime: $startTime
        endTime: $endTime
        limit: $limit
      ) {
        data
        nextPageTimestamp
      }
    }
  }
}
