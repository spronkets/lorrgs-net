query ReportMetadata($code: String!) {
  reportData {
    report(code: $code) {
      code
      title
      startTime
      endTime
      zone {
        id
        name
      }
      fights {
        id
        name
        startTime
        endTime
        kill
        difficulty
        phaseTransitions {
          id
          startTime
        }
      }
      masterData {
        actors(type: "Player") {
          id
          name
          subType
          type
        }
        abilities {
          gameID
          name
          icon
        }
      }
    }
  }
}
