query ReportLookup($code: String!) {
  reportData {
    report(code: $code) {
      code
      title
      startTime
      guild {
        name
        faction { id }
        server {
          name
          region { slug }
        }
      }
      zone {
        id
        name
      }
      fights {
        id
        name
        kill
        difficulty
        encounterID
        startTime
        endTime
      }
      masterData {
        actors(type: "Player") {
          id
          name
          subType
        }
      }
    }
  }
}
