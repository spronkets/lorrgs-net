query BossTimelineMetadata($code: String!, $fightIds: [Int!]) {
  reportData {
    report(code: $code) {
      code
      title
      fights(fightIDs: $fightIds) {
        id
        encounterID
        name
        startTime
        endTime
        phaseTransitions { id startTime }
      }
      masterData {
        abilities { gameID name icon }
      }
    }
  }
}
