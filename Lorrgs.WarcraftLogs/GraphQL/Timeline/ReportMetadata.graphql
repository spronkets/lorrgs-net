query ReportTimelineMetadata($code: String!) {
  reportData {
    report(code: $code) {
      code
      title
      fights {
        id
        encounterID
        name
        startTime
        endTime
        enemyNPCs { id }
        phaseTransitions { id startTime }
      }
      masterData {
        actors { id name type gameID }
        abilities { gameID name icon }
      }
    }
  }
}
