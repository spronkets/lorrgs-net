query BossTimelineEvents(
  $code: String!, $fightIds: [Int!], $startTime: Float!, $endTime: Float!
) {
  reportData {
    report(code: $code) {
      events(
        fightIDs: $fightIds, startTime: $startTime, endTime: $endTime,
        filterExpression: "type IN ('begincast','cast','damage','miss','heal','applybuff','refreshbuff','removebuff','applybuffstack','removebuffstack','death','resourcechange','drain','interrupt')", limit: 10000,
        useAbilityIDs: true, useActorIDs: true
      ) {
        data
        nextPageTimestamp
      }
    }
  }
}
